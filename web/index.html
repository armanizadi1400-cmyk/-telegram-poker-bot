<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>Telegram Poker</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07110d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            max-width: 520px;
            min-height: 100vh;
            margin: auto;
            padding: 14px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .chips {
            background: #14241d;
            padding: 9px 14px;
            border-radius: 12px;
        }

        .table {
            position: relative;
            height: 400px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    #17643e,
                    #0b3e29 60%,
                    #071f15
                );
            border: 10px solid #3a2415;
            box-shadow:
                0 20px 50px rgba(0,0,0,.5),
                inset 0 0 30px rgba(0,0,0,.4);
        }

        .pot {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .board {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 5px;
        }

        .card {
            width: 42px;
            height: 58px;
            background: white;
            color: #111;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .player {
            position: absolute;
            width: 105px;
            padding: 7px;
            text-align: center;
            background: rgba(5,15,11,.9);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            transform: translate(-50%,-50%);
        }

        .player.active {
            border: 2px solid #e7c45b;
            box-shadow: 0 0 15px rgba(231,196,91,.4);
        }

        .p1 {
            top: 8%;
            left: 50%;
        }

        .p2 {
            top: 25%;
            left: 10%;
        }

        .p3 {
            top: 75%;
            left: 10%;
        }

        .p4 {
            top: 92%;
            left: 50%;
        }

        .p5 {
            top: 75%;
            left: 90%;
        }

        .p6 {
            top: 25%;
            left: 90%;
        }

        .hand {
            margin-top: 18px;
        }

        .hand-title {
            opacity: .7;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .hole {
            display: flex;
            gap: 8px;
        }

        .hole .card {
            width: 52px;
            height: 72px;
            font-size: 26px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 18px;
        }

        button {
            border: 0;
            border-radius: 13px;
            padding: 14px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            background: #1c3329;
        }

        .primary {
            background: #176b42;
        }

        .danger {
            background: #7d2929;
        }

        .raise {
            background: #235b9a;
        }

        button:active {
            transform: scale(.97);
        }

        .status {
            text-align: center;
            margin-top: 12px;
            opacity: .7;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="top">
        <div class="logo">♠ Poker</div>
        <div class="chips">
            🪙 <span id="balance">1000</span>
        </div>
    </div>

    <div class="table">

        <div class="pot">
            POT: <span id="pot">0</span> 🪙
        </div>

        <div class="board" id="board"></div>

        <div class="player p1">
            🤖
            <div>Player 1</div>
            <small>1000 🪙</small>
        </div>

        <div class="player p2">
            😎
            <div>Player 2</div>
            <small>1000 🪙</small>
        </div>

        <div class="player p3">
            🦊
            <div>Player 3</div>
            <small>1000 🪙</small>
        </div>

        <div class="player p4 active">
            👤
            <div id="username">You</div>
            <small id="mychips">1000 🪙</small>
        </div>

        <div class="player p5">
            🐯
            <div>Player 5</div>
            <small>1000 🪙</small>
        </div>

        <div class="player p6">
            🦁
            <div>Player 6</div>
            <small>1000 🪙</small>
        </div>

    </div>

    <div class="hand">

        <div class="hand-title">
            YOUR HAND
        </div>

        <div class="hole" id="hand">
            <div class="card">?</div>
            <div class="card">?</div>
        </div>

    </div>

    <div class="actions">

        <button onclick="action('check')">
            ✅ Check
        </button>

        <button onclick="action('call')">
            💰 Call
        </button>

        <button class="raise" onclick="action('raise')">
            📈 Raise
        </button>

        <button onclick="action('allin')">
            🔥 All-in
        </button>

        <button class="danger" onclick="action('fold')">
            ❌ Fold
        </button>

    </div>

    <div class="status" id="status">
        Connecting...
    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
    document.getElementById("username").innerText =
        user.first_name || "You";
}

function action(type) {

    document.getElementById("status").innerText =
        "Action: " + type;

    // مرحله بعد:
    // ارسال action به Python backend

    console.log({
        action: type,
        initData: tg.initData
    });
}

</script>

</body>
</html>
